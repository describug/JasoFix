name: release

# 버전 태그를 밀면 맥에서 빌드해 릴리스에 zip 을 붙인다.
#   git tag v1.1.3 && git push origin v1.1.3
# 저장소가 공개라 릴리스 파일을 누구나 받을 수 있다 — 따로 배포처가 필요 없다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 빌드
        run: ./build.sh

      - name: 버전 확인
        id: ver
        run: echo "v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: 압축
        # .app 은 심볼릭 링크·실행권한을 보존해야 하므로 ditto 로 압축한다
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent JasoFix.app ../JasoFix.zip

      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 파일명에 버전을 넣지 않는다 — 그래야 아래 주소가 늘 최신을 가리킨다.
          #   github.com/describug/JasoFix/releases/latest/download/JasoFix.zip
          files: JasoFix.zip
          body: |
            macOS 13 이상 · Apple Silicon(M1 이상) 전용 — Intel 맥에서는 실행되지 않습니다

            서명·공증이 없어 첫 실행이 막힙니다.
            시스템 설정 ▸ 개인정보 보호 및 보안 ▸ "그래도 열기" 를 한 번 눌러주세요.
